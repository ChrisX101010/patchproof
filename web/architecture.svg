<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" role="img" aria-labelledby="title desc"><title id="title">PatchProof serverless architecture</title><desc id="desc">Browser and publisher CLI use Lambda Function URL. Lambda keeps capsules in private S3 and a bounded index in DynamoDB. Browser and offline CLI verify SHA256 independently.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8a9c7c" stroke-width="1.3"/></marker></defs><rect width="1040" height="370" rx="12" fill="#fafbf6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="37" y="37" fill="#8b997e" font-size="11" letter-spacing="2">SMALL FOOTPRINT. PORTABLE EVIDENCE.</text><g fill="white" stroke="#d7dfcc"><rect x="38" y="86" width="222" height="76" rx="7"/><rect x="38" y="193" width="222" height="76" rx="7"/><rect x="392" y="118" width="250" height="119" rx="9" fill="#e4ecd9" stroke="#c4d4b3"/><rect x="774" y="86" width="226" height="76" rx="7"/><rect x="774" y="193" width="226" height="76" rx="7"/></g><g fill="#284331" font-size="18" font-weight="600"><text x="62" y="119">Browser</text><text x="62" y="225">Publisher CLI</text><text x="421" y="162">AWS Lambda</text><text x="798" y="119">Amazon S3</text><text x="798" y="225">DynamoDB</text></g><g fill="#77866a" font-size="12"><text x="62" y="142">Read · import · verify locally</text><text x="62" y="248">Authorized immutable publication</text><text x="421" y="184">HTTPS Function URL</text><text x="421" y="206">Web interface + validation API</text><text x="798" y="142">Private content-addressed capsules</text><text x="798" y="248">Bounded report index</text></g><g fill="none" stroke="#8a9c7c" stroke-width="1.5" marker-end="url(#arrow)"><path d="M260 124H331V155H382"/><path d="M260 231H331V202H382"/><path d="M642 155H706V124H764"/><path d="M642 202H706V231H764"/></g><text x="290" y="108" fill="#879879" font-size="10">GET</text><text x="280" y="258" fill="#879879" font-size="10">POST + publisher token</text><path d="M38 306H1000" stroke="#e0e6d7"/><text x="38" y="336" fill="#7f8e73" font-size="12">Independent verification: browser Web Crypto + Python offline CLI</text><text x="667" y="336" fill="#7f8e73" font-size="11">No VMs · No pipeline · No paid model API</text></g></svg>
